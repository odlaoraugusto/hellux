app = "hellux-backend"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile.prod"

[deploy]
  release_command = "alembic upgrade head"

[env]
  APP_NAME = "Hellux"
  APP_VERSION = "1.2.0"
  ENVIRONMENT = "production"
  DEBUG = "false"
  ACCESS_TOKEN_EXPIRE_MINUTES = "480"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
